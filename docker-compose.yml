version: "3.8"
services:
  postgres:
    container_name: devthropology-postgres
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devthropology
    ports:
      - "5433:5432"
    volumes:
      - ./_devthropology_postgres:/var/lib/postgresql/data
  postgres_prod:
    container_name: devthropology-postgres-prod
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devthropology
    ports:
      - "5434:5432"
    volumes:
      - ./_devthropology_postgres_prod:/var/lib/postgresql/data
  pgloader:
    build:
      context: .
      dockerfile: Dockerfile.pgloader
    depends_on:
      - postgres
    volumes:
      - ./:/data
    mem_limit: 10g
    entrypoint: ["pgloader"]
    command: []
