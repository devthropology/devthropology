name: CI

on:
  pull_request:

permissions:
  pull-requests: read
  contents: read
  actions: write

jobs:
  filter:
    name: Detect Backend Changes
    runs-on: ubuntu-latest
    outputs:
      run_backend_checks: ${{ steps.filter.outputs.backend }}
      run_frontend_checks: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'tools/**'
              - 'restore.ts'
              - 'Dockerfile.backend'
              - 'Dockerfile.devthropology'
              - '.dockerignore'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'tsconfig.test.json'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'
            frontend:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'frontend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'

  test-backend:
    name: Run Backend Tests
    needs: filter
    if: needs.filter.outputs.run_backend_checks == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check backend formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Run type check
        run: pnpm run check:node

      - name: Check test types
        run: pnpm run check:tests

      - name: Run tests
        run: pnpm run test:backend

  check-node-compatibility:
    name: Check Node 26 Compatibility
    needs: filter
    if: needs.filter.outputs.run_backend_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Check application types for Node
        run: pnpm run check:node
      - name: Smoke test application modules on Node 26
        run: pnpm run smoke:node

  lint-frontend:
    name: Run Frontend Checks
    needs: filter
    if: needs.filter.outputs.run_frontend_checks == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run oxlint
        run: pnpm exec oxlint .
        working-directory: frontend

      - name: Generate React Router types
        run: pnpm exec react-router typegen
        working-directory: frontend

      - name: Run type-aware oxlint
        run: pnpm exec oxlint --type-aware --type-check .
        working-directory: frontend

      - name: Check formatting
        run: pnpm exec oxfmt --check .
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm run test:frontend
